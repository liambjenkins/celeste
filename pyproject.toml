[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "celeste"
version = "0.1.0"
description = "A celestial intelligence engine for intentional living"
requires-python = ">=3.12"
dependencies = [
    "pyswisseph",
    "pytest"
]

[tool.pytest.ini_options]
pythonpath = ["src"]